<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#1B1B1B"/>

  <!-- Beta Cross Symbol -->
  <g transform="translate(96, 80)">
    <!-- Vertical bar of cross -->
    <rect x="135" y="32" width="50" height="240" rx="8" fill="#BF531A"/>

    <!-- Horizontal bar of cross -->
    <rect x="80" y="88" width="160" height="50" rx="8" fill="#BF531A"/>

    <!-- Beta letter stylized below -->
    <text x="160" y="340"
          font-family="DM Sans, Arial, sans-serif"
          font-size="64"
          font-weight="700"
          fill="#F5E7D7"
          text-anchor="middle">
      BETA
    </text>
  </g>
</svg>
